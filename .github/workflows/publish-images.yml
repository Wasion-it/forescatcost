name: Publicar imagens imutáveis

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: forecast-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  container-build:
    name: Construir e publicar imagens
    uses: ./.github/workflows/includes-container-build.yml
    secrets: inherit
    with:
      image_tag: sha-${{ github.sha }}
      push: true
      runner_label: self-hosted

  report:
    name: Resumo da publicação
    runs-on: ubuntu-latest
    if: ${{ always() }}
    needs: container-build
    steps:
      - name: Gerar resumo
        run: |
          {
            echo '## Publicação de imagens'
            echo ''
            echo "- Resultado: ${{ needs.container-build.result }}"
            echo "- Commit: ${{ github.sha }}"
            echo "- Tag imutável: sha-${{ github.sha }}"
            echo '- Registry: registry.wasion.com.br'
          } >> "$GITHUB_STEP_SUMMARY"
