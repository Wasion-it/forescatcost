name: Validar projeto

on:
  workflow_call:
    inputs:
      environment:
        description: Nome do ambiente
        required: true
        type: string

jobs:
  test:
    name: Testes backend e frontend
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: forecast
          POSTGRES_PASSWORD: forecast_ci
          POSTGRES_DB: forecast
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U forecast -d forecast"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    env:
      AMBIENTE: dev
      TEST_DATABASE_URL: postgresql+psycopg://forecast:forecast_ci@127.0.0.1:5432/forecast
      SEED_SENHA: senha-ci-nao-produtiva

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Configurar uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Instalar dependências do backend
        working-directory: backend
        run: uv sync --frozen --all-groups

      - name: Ruff
        working-directory: backend
        run: uv run ruff check .

      - name: Pytest
        working-directory: backend
        run: uv run pytest

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências do frontend
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Testes frontend
        working-directory: frontend
        run: npm test

      - name: Typecheck frontend
        working-directory: frontend
        run: npm run typecheck

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Resumo
        if: ${{ always() }}
        run: |
          {
            echo '## Validação do Forecast'
            echo ''
            echo '- Backend: uv + Ruff + pytest'
            echo '- Banco CI: PostgreSQL 16'
            echo '- Frontend: Vitest + TypeScript + Vite build'
            echo '- Ambiente: ${{ inputs.environment }}'
          } >> "$GITHUB_STEP_SUMMARY"
