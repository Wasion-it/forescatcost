name: Pull Request Security

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: security-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  security:
    name: Validar segurança
    uses: ./.github/workflows/includes-security.yml
    permissions:
      contents: read
