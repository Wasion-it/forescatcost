services:
  db:
    image: postgres:16-alpine
    container_name: forecast-db
    environment:
      POSTGRES_USER: forecast
      POSTGRES_PASSWORD: forecast_dev
      POSTGRES_DB: forecast
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - forecast_pgdata:/var/lib/postgresql/data
      - ./infra/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forecast -d forecast"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  backend:
    build:
      context: ./backend
    image: forecast-backend:dev
    environment:
      AMBIENTE: dev
      DATABASE_URL: postgresql+psycopg://forecast:forecast_dev@db:5432/forecast
      JWT_SEGREDO: ${JWT_SEGREDO:-}
      CORS_ORIGENS: '["http://localhost:5173","http://localhost:8080","http://127.0.0.1:8080"]'
      RUN_MIGRATIONS: "true"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  frontend:
    build:
      context: ./frontend
    image: forecast-frontend:dev
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

volumes:
  forecast_pgdata:
